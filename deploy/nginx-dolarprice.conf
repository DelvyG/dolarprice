# DolarPrice - dolarprice.com
# La app Node escucha en 127.0.0.1:3200; nginx sirve los estaticos directo
# desde disco y solo delega en Node lo dinamico.

server {
    listen 80;
    listen [::]:80;
    server_name dolarprice.com www.dolarprice.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://dolarprice.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dolarprice.com;

    ssl_certificate     /etc/nginx/ssl-temp/dolarprice.crt;
    ssl_certificate_key /etc/nginx/ssl-temp/dolarprice.key;

    return 301 https://dolarprice.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dolarprice.com;

    ssl_certificate     /etc/nginx/ssl-temp/dolarprice.crt;
    ssl_certificate_key /etc/nginx/ssl-temp/dolarprice.key;

    root /var/www/dolarprice/public;
    index index.html;

    # IP real del visitante detras de Cloudflare (solo para este sitio)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    client_max_body_size 1m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Digital Asset Links: la app de Google Play no valida si no llega como JSON.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # El service worker nunca se cachea, o los usuarios quedan clavados en una version vieja.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @app;
    }

    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
